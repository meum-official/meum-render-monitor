name: MEUM external render check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '한 번 점검하거나, 지금부터 6시간 동안 매시간 점검합니다.'
        required: true
        default: once
        type: choice
        options: [once, burst6h]
      scan_minutes:
        description: '한 실행의 브라우저 점검 한도(미완료는 이어감)'
        required: true
        default: '55'
        type: choice
        options: ['2', '55']
  repository_dispatch:
    types: [meum-deployed]

permissions:
  contents: write
  pages: write

concurrency:
  group: meum-render-monitor
  cancel-in-progress: false

jobs:
  render:
    if: vars.MONITOR_DIAGNOSTIC_HOLD != 'true' || (github.event_name == 'workflow_dispatch' && github.run_attempt == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_DIR: ${{ github.workspace }}/data
      MONITOR_MODE: ${{ vars.MONITOR_MODE || 'after-deploy' }}
      MONITOR_MANUAL_MODE: ${{ inputs.run_mode || 'once' }}
      MONITOR_DIAGNOSTIC_HOLD: ${{ vars.MONITOR_DIAGNOSTIC_HOLD }}
      MONITOR_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/render-check.yml
      SCAN_MAX_MINUTES: ${{ inputs.scan_minutes || '55' }}
      RETAINED_RUNS: '1'
      MONITOR_RENDER_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore public report and CI state from main docs
        id: restore
        run: node publish-report.mjs restore

      - name: Check deployment fingerprint and six-hour window
        id: gate
        timeout-minutes: 3
        run: node ci.mjs gate

      - name: Install tester only when a browser check is due
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        if: steps.gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify monitor logic
        if: steps.gate.outputs.should_run == 'true'
        id: tests
        continue-on-error: true
        run: |
          node ci.mjs self-test
          npm test
          npm run test:browser

      - name: Scan public pages sequentially
        if: steps.gate.outputs.should_run == 'true' && steps.tests.outcome == 'success'
        id: scan
        shell: bash
        env:
          MONITOR_STOP_AT: ${{ steps.gate.outputs.reason != 'manual-once' && steps.gate.outputs.watch_until || '' }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          set +e
          node server.mjs --once
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export public report even when checks fail or are skipped
        id: export
        if: always() && env.MONITOR_STATE_READY == 'true' && steps.gate.outcome == 'success'
        env:
          MONITOR_SCAN_STARTED_AT: ${{ steps.gate.outputs.should_run == 'true' && (steps.scan.outputs.started_at || env.MONITOR_JOB_STARTED_AT) || '' }}
        run: node export-report.mjs

      - name: Publish report and verify the exact Pages build
        id: publication
        if: always() && steps.export.outcome == 'success'
        run: node publish-report.mjs

      - name: Summarize observed results
        if: always() && env.MONITOR_STATE_READY == 'true'
        env:
          MONITOR_SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code || 'not-run' }}
          MONITOR_PAGES_URL: ${{ steps.publication.outputs.verified == 'true' && steps.publication.outputs.page_url || '' }}
        run: node ci.mjs summary

      - name: Preserve test scan and publication failures
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          SHOULD_RUN: ${{ steps.gate.outputs.should_run }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          PUBLICATION_VERIFIED: ${{ steps.publication.outputs.verified }}
        shell: bash
        run: |
          if [ "$RESTORE_OUTCOME" != 'success' ] || [ "$GATE_OUTCOME" != 'success' ] || [ "$EXPORT_OUTCOME" != 'success' ] || [ "$PUBLICATION_OUTCOME" != 'success' ] || [ "$PUBLICATION_VERIFIED" != 'true' ]; then
            echo '보고서 복원·내보내기·게시 확인 중 하나가 완료되지 않았습니다.'
            exit 1
          fi
          if [ "$SHOULD_RUN" = 'true' ] && { [ "$TEST_OUTCOME" != 'success' ] || [ "$SCAN_EXIT_CODE" != '0' ]; }; then
            echo '페이지 문제 또는 미확인 범위가 남아 있습니다. 게시된 보고서를 확인하세요.'
            exit 1
          fi
